  "components": {
    "securitySchemes": {
      "AuthToken": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "SDKWork auth token carried as Authorization: Bearer <auth_token>."
      },
      "AccessToken": {
        "type": "apiKey",
        "in": "header",
        "name": "Access-Token",
        "description": "SDKWork access isolation token."
      }
    },
    "schemas": {
      "VoiceApiResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "message",
          "requestId",
          "data"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "requestId": {
            "type": "string",
            "format": "uuid",
            "description": "Server-owned request correlation id."
          },
          "data": {
            "type": "object",
            "additionalProperties": true
          }
        }
      },
      "VoiceOperationCommand": {
        "type": "object",
        "additionalProperties": true,
        "description": "Operation-specific command payload for SDKWork Voice speech, transcription, translation, provider route, and artifact operations.",
        "properties": {
          "mediaResource": {
            "$ref": "#/components/schemas/MediaResource"
          }
        }
      },
      "MediaResource": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "kind",
          "mimeType",
          "uri"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "kind": {
            "type": "string",
            "enum": [
              "audio",
              "voice"
            ]
          },
          "mimeType": {
            "type": "string"
          },
          "uri": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "durationMs": {
            "type": "integer",
            "minimum": 0
          },
          "sizeBytes": {
            "type": "string",
            "pattern": "^[0-9]+$",
            "description": "Int64-compatible byte size serialized as a string.",
            "x-sdkwork-int64-string": true
          },
          "metadata": {
            "type": "object",
            "additionalProperties": true
          }
        }
      },
      "ProblemDetail": {
        "type": "object",
        "additionalProperties": true,
        "required": [
          "type",
          "title",
          "status"
        ],
        "properties": {
          "type": {
            "type": "string",
            "format": "uri-reference"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer",
            "minimum": 100,
            "maximum": 599
          },
          "detail": {
            "type": "string"
          },
          "instance": {
            "type": "string"
          },
          "code": {
            "type": "string"
          },
          "traceId": {
            "type": "string"
          },
          "requestId": {
            "type": "string",
            "format": "uuid",
            "description": "Server-owned request correlation id."
          },
          "errors": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/FieldError"
            }
          }
        }
      },
      "FieldError": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "field",
          "message"
        ],
        "properties": {
          "field": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "code": {
            "type": "string"
          }
        }
      }
    }
