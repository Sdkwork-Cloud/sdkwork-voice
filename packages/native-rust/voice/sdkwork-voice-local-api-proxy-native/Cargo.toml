[package]
name = "sdkwork-voice-local-api-proxy-native"
version = "0.1.0"
edition = "2021"
description = "Native runtime support for SDKWork Voice local API proxy."
license = "UNLICENSED"
publish = false

[lib]
name = "sdkwork_voice_local_api_proxy_native"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
