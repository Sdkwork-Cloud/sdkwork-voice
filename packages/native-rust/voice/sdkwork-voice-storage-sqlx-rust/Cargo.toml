[package]
name = "sdkwork-voice-storage-sqlx-rust"
version = "0.1.0"
edition = "2021"
description = "SDKWork Voice SQL storage contract and migration catalog."
license = "UNLICENSED"
publish = false

[lib]
name = "sdkwork_voice_storage_sqlx"
path = "src/lib.rs"

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "any", "sqlite", "postgres"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
