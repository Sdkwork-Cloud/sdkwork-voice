version: 2
defaultProfile: cloud.production
profiles:
  cloud.test:
    deployment:
      deploymentProfile: cloud
      environment: test
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: voice-test.sdkwork.com
        tls: sdkwork.com
        mode: api
        apiPathStyle: full-prefix
      - domain: voice-test.birdcoder.com
        tls: birdcoder.com
        mode: api
        apiPathStyle: full-prefix
      - domain: voice-test.dtupay.com
        tls: dtupay.com
        mode: api
        apiPathStyle: full-prefix
      - domain: voice-test.sdkwork.cn
        tls: sdkwork.cn
        mode: api
        apiPathStyle: full-prefix
      - domain: voice-test.birdcoder.cn
        tls: birdcoder.cn
        mode: api
        apiPathStyle: full-prefix
      - domain: voice-test.dtupay.cn
        tls: dtupay.cn
        mode: api
        apiPathStyle: full-prefix
      - domain: voice-test.skubc.com
        tls: skubc.com
        mode: api
        apiPathStyle: full-prefix
      - domain: voice-test.skubc.cn
        tls: skubc.cn
        mode: api
        apiPathStyle: full-prefix
      - domain: voice-test.zowalk.com
        tls: zowalk.com
        mode: api
        apiPathStyle: full-prefix
      - domain: voice-test.zowalk.cn
        tls: zowalk.cn
        mode: api
        apiPathStyle: full-prefix
      - domain: voice-test.offer86.com
        tls: offer86.com
        mode: api
        apiPathStyle: full-prefix
      - domain: voice-test.offer86.cn
        tls: offer86.cn
        mode: api
        apiPathStyle: full-prefix
      - domain: voice-test.86offer.com
        tls: 86offer.com
        mode: api
        apiPathStyle: full-prefix
      - domain: voice-test.86offer.cn
        tls: 86offer.cn
        mode: api
        apiPathStyle: full-prefix
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.test
        env: etc/topology/cloud.test.env
      kubernetes:
        reference: deployments/kubernetes/
      proxy:
        upstreams:
          application.public-ingress: http://127.0.0.1:18096
          platform.api-gateway: http://127.0.0.1:3900
