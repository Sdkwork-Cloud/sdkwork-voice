# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/voice/webserver.pid;
error_log /var/log/sdkwork/voice/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:8080;
    }
    server {
        listen 80;
        server_name voice-dev.sdkwork.com voice-dev.birdcoder.com voice-dev.dtupay.com voice-dev.noaper.com voice-dev.sdkwork.cn voice-dev.birdcoder.cn voice-dev.dtupay.cn voice-dev.noaper.cn voice-dev.skubc.com voice-dev.skubc.cn voice-dev.zowalk.com voice-dev.zowalk.cn voice-dev.offer86.com voice-dev.offer86.cn voice-dev.86offer.com voice-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
